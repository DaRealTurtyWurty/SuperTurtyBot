plugins {
    id "java"
    id "application"
    id "com.gradleup.shadow" version "8.3.3"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()

    maven {
        url "https://repository.jboss.org/nexus/content/groups/public-jboss/"
    }

    maven {
        url "https://jitpack.io"
    }
}

dependencies {
    implementation "com.google.guava:guava:33.3.1-jre"
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "org.reflections:reflections:0.10.2"
    implementation "org.xerial:sqlite-jdbc:3.47.0.0"

    implementation "commons-io:commons-io:2.18.0"
    implementation "org.apache.commons:commons-lang3:3.17.0"
    implementation "org.apache.commons:commons-text:1.12.0"
    implementation "org.apache.commons:commons-math3:3.6.1"
    implementation "commons-validator:commons-validator:1.9.0"
    implementation "com.microsoft.onnxruntime:onnxruntime:1.18.0"

    implementation "org.eclipse.mylyn.github:org.eclipse.egit.github.core:2.1.5"
    implementation "org.eclipse.jgit:org.eclipse.jgit:7.1.0.202411261347-r"

    implementation "org.mongodb:mongodb-driver-sync:5.2.1"
    implementation "org.mongodb.morphia:morphia:1.3.2"
    implementation "io.github.cdimascio:dotenv-java:3.0.2"
    implementation "org.spongepowered:configurate-hocon:4.1.2"

    implementation "ch.qos.logback:logback-classic:1.5.12"

    implementation "com.vdurmont:emoji-java:5.1.1"
    implementation "org.jsoup:jsoup:1.18.3"
    implementation "net.dean.jraw:JRAW:1.1.0"
    implementation "com.github.scribejava:scribejava-apis:8.3.3"
    implementation "com.github.LowLevelSubmarine:GeniusLyricsAPI:1.0.3"
    implementation "com.github.oshi:oshi-core:6.6.5"
    implementation "io.github.matyrobbrt:curseforgeapi:1.8.0"
    implementation "net.bramp.ffmpeg:ffmpeg:0.8.0"
    implementation "io.github.fastily:jwiki:1.11.0"
    implementation "com.openai:openai-java:4.41.0"
    implementation "com.knuddels:jtokkit:1.1.0"
    implementation "com.github.bhlangonijr:chesslib:1.3.4"

    implementation "org.jfree:jfreechart:1.5.5"
    implementation "com.jhlabs:filters:2.0.235-1"

    implementation "net.sourceforge.argparse4j:argparse4j:0.9.0"

    implementation "net.dv8tion:JDA:6.1.1"

    implementation "com.github.twitch4j:twitch4j:1.23.0"
    implementation "com.github.philippheuer.events4j:events4j-handler-reactor:0.12.2"
    implementation "com.lukaspradel:steam-web-api:1.9.0"
    implementation "com.apptasticsoftware:rssreader:3.9.0"
    implementation "io.javalin:javalin:6.4.0"
    implementation "org.graalvm.js:js-language:24.1.1"
    implementation "org.graalvm.python:python-language:24.1.1"

    annotationProcessor "org.projectlombok:lombok:1.18.44"
    compileOnly "org.projectlombok:lombok:1.18.44"
}

application {
    mainClass = "dev.darealturtywurty.superturtybot.TurtyBot"
}

jar {
    manifest {
        attributes(
                "Implementation-Title": "SuperTurtyBot",
                "Implementation-Version": "1.0-alpha",
                "Main-Class": "dev.darealturtywurty.superturtybot.TurtyBot"
        )
    }
}

shadowJar {
    zip64 true

    mergeServiceFiles()
}

compileJava.options.encoding = "UTF-8"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
